<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielprognosen Übersicht V23</title>
    <style>
        html, body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #eee; }
        .header { padding: 20px; background: linear-gradient(90deg, #1f1f1f, #2c2c2c); display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 1.6em; font-weight: bold; letter-spacing: 1px; }
        .status { font-size: 1em; }
        .toggle-btn { background: #ffcc00; color: #111; padding: 6px 12px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .toggle-btn.active { background: #00c853; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: linear-gradient(135deg, #1e1e1e 0%, #282828 100%); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); padding: 20px; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,0.8); }
        .teams { font-weight: 600; font-size: 1em; margin: 6px 0; text-align: center; }
        .score { font-size: 1.8em; font-weight: 700; color: #ffcc00; margin: 8px 0; }
        .bar { width: 80%; height: 8px; background: #333; border-radius: 4px; margin: 8px 0; overflow: hidden; }
        .fill { height: 100%; background: linear-gradient(90deg, #ffcc00, #ffeb3b); }
        .info { font-size: 0.85em; color: #ccc; margin: 6px 0; text-align: center; }
        @media (max-width: 600px) { .card { padding: 15px; } .title { font-size: 1.4em; } }
    </style>
</head>
<body>
<div class="header">
  <div class="title">Spielprognosen</div>
  <div class="status" id="statusText">Gewinn-Modus: Aus</div>
  <button class="toggle-btn" id="toggleButton">Toggle</button>
</div>

<div class="grid" id="grid"></div>

<script>
    let gainMode = false;
    const toggleButton = document.getElementById('toggleButton');
    const statusText = document.getElementById('statusText');
    toggleButton.addEventListener('click', function() {
        gainMode = !gainMode;
        statusText.textContent = 'Gewinn-Modus: ' + (gainMode ? 'Ein' : 'Aus');
        toggleButton.classList.toggle('active', gainMode);
        render();
    });

    const matches = [
        {teams: 'Deutschland vs Curacao', score: '4 - 0', prob: 75, conf: 'hoch'},
        {teams: 'Schweiz vs Katar', score: '3 - 0', prob: 70, conf: 'hoch'},
        {teams: 'Brasilien vs Marokko', score: '2 - 0', prob: 65, conf: 'hoch'},
        {teams: 'Niederlande vs Japan', score: '2 - 1', prob: 55, conf: 'mittel'},
        {teams: 'Australien vs Turkei', score: '1 - 2', prob: 55, conf: 'mittel'},
        {teams: 'Haiti vs Schottland', score: '0 - 2', prob: 55, conf: 'mittel'},
        {teams: 'Kanada vs Bosnien', score: '1 - 1', prob: 50, conf: 'mittel'}
    ];

    function adjustScore(scoreStr) {
        if (!gainMode) return scoreStr;
        const parts = scoreStr.split('-').map(s => parseInt(s.trim()));
        let [a, b] = parts;
        if (a > b) {
            const diff = a - b;
            if (diff > 1) a -= 1;
            else if (diff === 1) b = a;
        } else if (b > a) {
            const diff = b - a;
            if (diff > 1) b -= 1;
            else if (diff === 1) a = b;
        }
        return a + ' - ' + b;
    }

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        matches.forEach(m => {
            const card = document.createElement('div'); card.className = 'card';
            const teamsDiv = document.createElement('div'); teamsDiv.className = 'teams'; teamsDiv.textContent = m.teams;
            const scoreDiv = document.createElement('div'); scoreDiv.className = 'score'; scoreDiv.textContent = adjustScore(m.score);
            const barDiv = document.createElement('div'); barDiv.className = 'bar';
            const fillDiv = document.createElement('div'); fillDiv.className = 'fill'; fillDiv.style.width = m.prob + '%'; barDiv.appendChild(fillDiv);
            const infoDiv = document.createElement('div'); infoDiv.className = 'info'; infoDiv.textContent = m.prob + '% - Vertrauen ' + m.conf;
            card.appendChild(teamsDiv);
            card.appendChild(scoreDiv);
            card.appendChild(barDiv);
            card.appendChild(infoDiv);
            grid.appendChild(card);
        });
    }

    render();
</script>

</body>
</html>
